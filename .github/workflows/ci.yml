name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Deployment und Rollback unter Linux testen
        run: python3 deployment/test_deploy.py

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Anwendung testen
        env:
          CI: true
        run: npm test

      - name: Anwendung bauen
        run: npm run build

      - name: Build-Verzeichnis pruefen
        run: ls -la build

      - name: Build als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: build/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ENABLE_EC2_DEPLOY == 'true'
    # Runner in the same network as the administrator (Security Group: My IP).
    runs-on: [self-hosted, ec2-deploy]
    timeout-minutes: 15
    environment: production
    concurrency:
      group: ec2-production
      cancel-in-progress: false
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Getesteten Build herunterladen
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: build

      - name: Git Bash auf Windows verwenden
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $gitRoot = Split-Path (Split-Path (Get-Command git.exe).Source -Parent) -Parent
          $gitBashDir = Join-Path $gitRoot 'bin'
          if (-not (Test-Path (Join-Path $gitBashDir 'bash.exe'))) {
            throw 'Git Bash wurde nicht gefunden. Git for Windows installieren.'
          }
          $gitBashDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build per SSH ausrollen
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          : "${EC2_HOST:?Missing EC2_HOST}"
          : "${EC2_USER:?Missing EC2_USER}"
          : "${EC2_SSH_KEY:?Missing EC2_SSH_KEY}"
          : "${EC2_KNOWN_HOSTS:?Missing EC2_KNOWN_HOSTS}"
          [[ "$EC2_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$EC2_USER" == ubuntu ]]
          release="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s\n' "$release" > build/version.txt
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf -- "$ssh_dir"' EXIT
          chmod 700 "$ssh_dir"
          printf '%s\n' "$EC2_SSH_KEY" > "$ssh_dir/key"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          options=(-i "$ssh_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$ssh_dir/known_hosts" -o ConnectTimeout=15)
          remote="/home/ubuntu/incoming/$release"
          ssh "${options[@]}" "$EC2_USER@$EC2_HOST" "mkdir -m 700 '$remote'"
          scp "${options[@]}" -r build deployment deploy.sh "$EC2_USER@$EC2_HOST:$remote/"
          ssh "${options[@]}" "$EC2_USER@$EC2_HOST" "bash '$remote/deploy.sh' '$remote' '$release'"
          actual="$(curl --fail --silent --show-error --max-time 15 "http://$EC2_HOST:8080/version.txt")"
          [[ "$actual" == "$release" ]]
